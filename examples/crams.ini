# ============================================================================
#  CRAMS — example input file (every supported parameter, documented)
# ============================================================================
#
#  Run with:   ./crams examples/crams.ini          (add -q / --quiet to silence)
#
#  Syntax
#  ------
#    * One "key value" pair per line.
#    * Keys are case-insensitive and underscores/spaces in the key are ignored,
#      so "inelastic_model", "InelasticModel" and "inelasticmodel" are the same.
#    * Lines whose first token is not a recognised key are ignored, so '#'
#      comments, blank lines, and unknown keys are all safe (silently skipped).
#    * The last occurrence of a key wins.
#
#  The values below are *example* values chosen to exercise every input; the
#  CRAMS default for each parameter is given in the comment. This file is also
#  parsed by the test suite (tests/test_example_ini.cpp), so it always stays in
#  sync with the keys the code actually understands.
# ----------------------------------------------------------------------------

# ============================  TRANSPORT  ===================================
# d0      diffusion coefficient normalisation, in units of 1e28 cm^2/s   (default 2.48255)
d0        3.0
# delta   diffusion spectral index above the break, D(R) ∝ R^delta        (default 0.565132)
delta     0.50
# ddelta  reduction of the slope below the break (R < rb)                 (default 0.22)
ddelta    0.20
# rb      diffusion break rigidity [GV]                                   (default 290.0)
rb        300.0
# va      Alfvén speed (advective transport) [km/s]                       (default 4.4094)
va        5.0
# h       halo half-height [kpc]                                          (default 7.0)
h         5.0
# phi     solar-modulation potential (force-field) [GV]                   (default 0.487754)
phi       0.60
# xs      grammage at the source [g/cm^2]; a value <= 0 disables it       (default -1.0)
xs        -1.0

# ============================  NUMERICS  ====================================
# solver  flux solver: analytical | crank_nicolson | exponential          (default crank_nicolson)
solver    crank_nicolson
# inelastic_model  inelastic cross-sections: tripathi99 | glauber | crosec  (default tripathi99)
inelastic_model  glauber
# fragmentation_model  fragmentation cross-sections:                       (default fluka4dragon)
#   fluka4dragon | usine_galprop17_opt12 | usine_galprop17_opt22 | usine_webber03_coste12
fragmentation_model  fluka4dragon
# id      integer tag appended to output file names,                      (default 0)
#         e.g. output/<simname>_spectra_R_<id>.txt
id        7

# ======================  INJECTION: SPECTRAL INDICES  =======================
# hslope   injection slope of protons      (Z = 1)                         (default 4.37486)
hslope    4.40
# heslope  injection slope of helium       (Z = 2)                         (default 4.30995)
heslope   4.35
# slope    common injection slope of all nuclei with Z >= 3 (Li … Ni)      (default 4.32798)
slope     4.30

# ======================  INJECTION: SOURCE ABUNDANCES  ======================
# One key per element charge group (dimensionless). Each sets the source
# abundance of that element; the value is split over the element's isotopes
# according to their ISM isotopic fractions. Elements that are purely
# secondary default to 0. (qli is set non-zero here only to exercise the
# nuclei-abundance path in the test; physically it is 0.)
qh        5.06605e-02
qhe       2.54369e-02
qli       1.0e-04
qbe       0.0
qb        0.0
qc        3.98879e-03
qn        3.36117e-04
qo        7.15129e-03
qf        0.0
qne       1.34031e-03
qna       0.5e-04
qmg       2.38948e-03
qal       2.7e-04
qsi       2.77911e-03
qp        1.0e-04
qs        4.87000e-04
qcl       0.0
qar       3.0e-04
qk        0.0
qca       4.0e-04
qsc       0.0
qti       0.0
qv        0.0
qcr       2.5e-04
qmn       0.0
qfe       6.80000e-03
qco       0.0
qni       4.0e-04
